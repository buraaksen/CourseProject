<html xmlns:th="http://www.thymeleaf.org">

<body>
<h1>Please add room data:</h1>

<form method="post" th:object="${room}" th:action="@{/room/crud/add}">

<table>
<tr>
<td> Property ID </td>
<td> <input type="number" th:field="*{PrId}" /> </td>
<td th:if="${#fields.hasErrors('PrId')}" th:errors="*{PrId}" > </td>
</tr>

<tr>
<td> Room Number </td>
<td> <input type="text" th:field="*{roomNumber}" /> </td>
<td th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}" > </td>
</tr>

<tr>
<td> Capacity </td>
<td> <input type="number" th:field="*{capacity}" /> </td>
<td th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" > </td>
</tr>

<tr>
<td> Price Per Night </td>
<td> <input type="number" step="0.01" th:field="*{pricePerNight}" /> </td>
<td th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}" > </td>
</tr>

</table>

<input type="submit" />

</form>

</body>

</html>
