<html xmlns:th="http://www.thymeleaf.org">

<body>
<h1>Please add payment data:</h1>

<form method="post" th:object="${payment}" th:action="@{/payment/crud/add}">

<table>
<tr>
<td> Amount </td>
<td> <input type="text" th:field="*{amount}" />      </td>
<td th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" > </td>
</tr>

<tr>
<td> Payment Method </td>
<td>
    <select th:field="*{payment}">
        <option value="cash">cash</option>
        <option value="card">card</option>
        <option value="paypal">paypal</option>
        <option value="other">other</option>
    </select>
</td>
<td th:if="${#fields.hasErrors('payment')}" th:errors="*{payment}" > </td>
</tr>

<tr>
<td> Reservation ID </td>
<td> <input type="number" name="reservationId" />      </td>
</tr>

</table>

<input type="submit" />

</form>

</body>

</html>
