<html xmlns:th="http://www.thymeleaf.org">

<body>
<h1>Please update payment data:</h1>

<form method="post" th:object="${payment}"
th:action="@{/payment/crud/update/__${payment.idPay}__}">

<table>
<tr>
<td> Is Successful </td>
<td>

</tr>

</table>

<input type="submit" />

</form>

</body>

</html>
