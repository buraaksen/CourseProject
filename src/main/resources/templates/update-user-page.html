<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>
<body>

<h1>User Profile Details:</h1>

<table>
    <tr>
        <td>ID</td>
        <td th:text="${box.id}"></td>
    </tr>
    <tr>
        <td>Name</td>
        <td th:text="${box.name}"></td>
    </tr>
    <tr>
        <td>Surname</td>
        <td th:text="${box.surname}"></td>
    </tr>
    <tr>
        <td>Email</td>
        <td th:text="${box.email}"></td>
    </tr>
    <tr>
        <td>Status</td>
        <td th:text="${box.role?.name()}"></td>
    </tr>
</table>

<br>
<a th:href="@{/user/all}">Back to Users</a>

</body>
</html>
