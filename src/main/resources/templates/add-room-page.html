<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Room</title>
</head>
<body>
<h1>Please add room data:</h1>

<form method="post" th:object="${room}" th:action="@{/room/crud/add}">

<table>
<tr>
    <td> Property ID </td>
    <td> <input type="number" th:field="*{prId.prId}" /> </td>
    <td th:if="${#fields.hasErrors('prId.prId')}" th:errors="*{prId.prId}" style="color:red;"> </td>
</tr>

<tr>
    <td> Room Number </td>
    <td> <input type="text" th:field="*{roomNumber}" /> </td>
    <td th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}" style="color:red;"> </td>
</tr>

<tr>
    <td> Capacity </td>
    <td> <input type="number" th:field="*{capacity}" /> </td>
    <td th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" style="color:red;"> </td>
</tr>

<tr>
    <td> Price Per Night </td>
    <td> <input type="number" step="0.01" th:field="*{pricePerNight}" /> </td>
    <td th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}" style="color:red;"> </td>
</tr>
</table>

<br/>
<input type="submit" value="Send" />

</form>

</body>
</html>
