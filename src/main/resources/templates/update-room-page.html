<form th:action="@{'/room/crud/update/' + ${room.roId}}" th:object="${room}" method="post">
    
    <input type="hidden" th:field="*{prId}">

    <table border="1">
        <tr>
            <th>Room Number</th>
            <th>Capacity</th>
            <th>Price per Night</th>
        </tr>
        <tr>
            <td><input type="text" th:field="*{roomNumber}"></td>
            <td><input type="number" th:field="*{capacity}"></td>
            <td><input type="number" step="0.01" th:field="*{pricePerNight}"></td>
        </tr>
    </table>

    <br>
    <button type="submit">Save Changes</button>
    <a href="/room/crud/all">Back to all rooms</a>
</form>
